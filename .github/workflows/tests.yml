name: test
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      LOKY_MAX_CPU_COUNT: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check src tests
      - run: uv run pytest -q
