[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "possession-lab"
version = "0.1.0"
description = "Reproducible multi-sport possession creation and defensive disruption research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "pyarrow>=17", "scipy>=1.13", "scikit-learn>=1.5,<2", "matplotlib>=3.9", "requests>=2.32", "joblib>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
possession-lab = "possession_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
